name: Deploy to GitHub Pages
on:
  push:
    branches: [main, cicd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm approve-builds esbuild || true
      - run: pnpm --filter @tech-deep-dives/efa build
      - run: pnpm --filter @tech-deep-dives/silicon-memory-inference build
      - run: pnpm --filter @tech-deep-dives/vllm build
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/efa _site/silicon-memory-inference _site/vllm
          cp -r deep-dives/efa/dist/. _site/efa/
          cp -r deep-dives/silicon-memory-inference/dist/. _site/silicon-memory-inference/
          cp -r deep-dives/vllm/dist/. _site/vllm/
          cp .github/pages-index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
